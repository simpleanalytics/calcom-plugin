<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Simple Analytics listing image, option 1: The dashboard, focused</title>
<style>
@font-face { font-family: "Space Grotesk"; font-weight: 300; src: url("assets/fonts/light.woff2") format("woff2"); }
@font-face { font-family: "Space Grotesk"; font-weight: 400; src: url("assets/fonts/regular.woff2") format("woff2"); }
@font-face { font-family: "Space Grotesk"; font-weight: 500; src: url("assets/fonts/medium.woff2") format("woff2"); }
@font-face { font-family: "Space Grotesk"; font-weight: 600; src: url("assets/fonts/semi-bold.woff2") format("woff2"); }
@font-face { font-family: "Space Grotesk"; font-weight: 700; src: url("assets/fonts/bold.woff2") format("woff2"); }

:root {
  --red: #ff4f64;
  --teal: #00bddc;
  --teal-fill: #d3f1f7;
  --slate: #2a373a;
  --slate-2: #425659;
  --muted: #697d80;
  --band: #eaf6fe;
  --page: #fcfbf9;
  --line: #e2ecee;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 1600px;
  height: 1280px;
  overflow: hidden;
  background: var(--page);
  font-family: "Space Grotesk", Arial, sans-serif;
  color: var(--slate);
  -webkit-font-smoothing: antialiased;
}

.band {
  position: absolute;
  inset: 0 0 auto 0;
  height: 634px;
  background: var(--band);
}

/* Brand row */
.brand {
  position: absolute;
  left: 88px;
  top: 72px;
  display: flex;
  align-items: center;
  gap: 22px;
  font-size: 52px;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--slate-2);
}
.brand svg { width: 64px; height: 64px; display: block; }

.privacy {
  position: absolute;
  right: 88px;
  top: 72px;
  height: 64px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 28px 0 14px;
  border-radius: 32px;
  background: #fff;
  font-size: 44px;
  font-weight: 500;
  color: var(--slate-2);
  box-shadow: 0 2px 0 rgba(42, 55, 58, 0.06);
}
.privacy svg { width: 34px; height: 34px; display: block; }

/* Headline */
h1 {
  position: absolute;
  left: 84px;
  top: 158px;
  font-size: 132px;
  line-height: 1.0;
  font-weight: 700;
  letter-spacing: -0.035em;
  color: var(--slate);
}
h1 em { font-style: normal; color: var(--red); }

.sub {
  position: absolute;
  left: 88px;
  top: 452px;
  font-size: 52px;
  line-height: 1.2;
  font-weight: 400;
  letter-spacing: -0.01em;
  color: var(--slate-2);
}

/* Dashboard card */
.card {
  position: absolute;
  left: 88px;
  right: 88px;
  top: 562px;
  height: 820px;
  padding: 42px 52px;
  border-radius: 36px;
  background: #fff;
  border: 2px solid var(--line);
  box-shadow: 0 40px 90px -20px rgba(42, 55, 58, 0.22), 0 6px 18px rgba(42, 55, 58, 0.05);
}

.top {
  display: grid;
  grid-template-columns: 420px 1fr;
  column-gap: 44px;
  height: 292px;
}

.stats {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.stat .label {
  font-size: 44px;
  line-height: 46px;
  font-weight: 400;
  color: var(--muted);
}
.stat .value {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: 2px;
}
.stat .num {
  font-size: 90px;
  line-height: 88px;
  font-weight: 400;
  letter-spacing: -0.04em;
  color: var(--slate);
}
.pill {
  height: 54px;
  padding: 0 18px;
  border-radius: 27px;
  background: #dbf0e4;
  color: #037303;
  font-size: 36px;
  line-height: 54px;
  font-weight: 500;
  letter-spacing: -0.02em;
  border: 2px solid #c5e4d1;
}

.chart { width: 100%; height: 292px; display: block; }

.events {
  margin-top: 26px;
  padding-top: 24px;
  border-top: 2px solid var(--line);
}
.events-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 14px;
}
.events-head b {
  font-size: 46px;
  line-height: 50px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.events-head span {
  font-size: 38px;
  color: var(--muted);
}

.row {
  height: 64px;
  margin-top: 8px;
  display: grid;
  grid-template-columns: 548px 1fr 118px;
  align-items: center;
}
.row .name {
  font-size: 46px;
  font-weight: 500;
  letter-spacing: -0.015em;
  color: var(--slate);
}
.row .track {
  height: 28px;
  border-radius: 14px;
  background: #edf5f6;
  overflow: hidden;
}
.row .track i {
  display: block;
  height: 100%;
  border-radius: 14px;
  background: var(--teal);
}
.row .count {
  text-align: right;
  font-size: 46px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--slate);
  font-variant-numeric: tabular-nums;
}
</style>
</head>
<body>
  <div class="band"></div>

  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="32" fill="#ff4f64"/>
      <path fill="#fff" d="M17.5 33.5h6.2V46h-6.2zM28.9 25.6h6.2V46h-6.2zM40.3 18h6.2v28h-6.2z"/>
    </svg>
    Simple Analytics
  </div>

  <div class="privacy"><svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="17" fill="#dbf0e4"/><path d="M9.5 17.6l5 5 10-10.6" fill="none" stroke="#037303" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>No cookies</div>

  <h1>See which pages<br>get you booked<em>.</em></h1>
  <p class="sub">Page views and booking events. No consent banner.</p>

  <div class="card">
    <div class="top">
      <div class="stats">
        <div class="stat">
          <div class="label">visitors</div>
          <div class="value"><span class="num">4.4k</span><span class="pill">+18%</span></div>
        </div>
        <div class="stat">
          <div class="label">pageviews</div>
          <div class="value"><span class="num">7.1k</span><span class="pill">+23%</span></div>
        </div>
      </div>

      <svg class="chart" viewBox="0 0 850 270" preserveAspectRatio="none" aria-hidden="true">
        <g stroke="#e9f0f1" stroke-width="2">
          <line x1="0" y1="67" x2="850" y2="67"/>
          <line x1="0" y1="134" x2="850" y2="134"/>
          <line x1="0" y1="201" x2="850" y2="201"/>
          <line x1="0" y1="269" x2="850" y2="269"/>
        </g>
        <path fill="#00bddc" fill-opacity="0.17" d="M0,270 L0.0,95.2 L29.3,79.4 L58.6,69.2 L87.9,83.9 L117.2,105.3 L146.6,169.6 L175.9,178.6 L205.2,86.1 L234.5,67.0 L263.8,58.0 L293.1,74.9 L322.4,94.0 L351.7,162.8 L381.0,172.9 L410.3,78.3 L439.7,56.8 L469.0,45.6 L498.3,64.7 L527.6,83.9 L556.9,157.2 L586.2,166.2 L615.5,69.2 L644.8,46.7 L674.1,32.0 L703.4,52.3 L732.8,76.0 L762.1,151.5 L791.4,160.5 L820.7,61.3 L850.0,37.7 L850,270 Z"/>
        <path fill="none" stroke="#00bddc" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" d="M0.0,95.2 L29.3,79.4 L58.6,69.2 L87.9,83.9 L117.2,105.3 L146.6,169.6 L175.9,178.6 L205.2,86.1 L234.5,67.0 L263.8,58.0 L293.1,74.9 L322.4,94.0 L351.7,162.8 L381.0,172.9 L410.3,78.3 L439.7,56.8 L469.0,45.6 L498.3,64.7 L527.6,83.9 L556.9,157.2 L586.2,166.2 L615.5,69.2 L644.8,46.7 L674.1,32.0 L703.4,52.3 L732.8,76.0 L762.1,151.5 L791.4,160.5 L820.7,61.3 L850.0,37.7"/>
      </svg>
    </div>

    <div class="events">
      <div class="events-head"><b>Events</b><span>last 30 days</span></div>
      <div class="row"><span class="name">booking_completed</span><div class="track"><i style="width:100%"></i></div><span class="count">318</span></div>
      <div class="row"><span class="name">booking_rescheduled</span><div class="track"><i style="width:12.9%"></i></div><span class="count">41</span></div>
      <div class="row"><span class="name">booking_cancelled</span><div class="track"><i style="width:7.2%"></i></div><span class="count">23</span></div>
    </div>
  </div>
</body>
</html>
